services:
  backend:
    build: &backend-build
      context: .
      dockerfile: Dockerfile
      target: server
    ports:
      - "${APP_PORT:-8000}:8000"
    environment: &knowledge-environment
      APP_NAME: GustoBot
      DEBUG: "${DEBUG:-false}"
      GUSTOBOT_ADMIN_PASSWORD: "${GUSTOBOT_ADMIN_PASSWORD:-}"
      SECRET_KEY: "${SECRET_KEY:-}"
      KNOWLEDGE_DOMAIN_FILE: "${KNOWLEDGE_DOMAIN_FILE:-gustobot/config/domains/recipes.yaml}"
      DATABASE_URL: "${DATABASE_URL:?Set DATABASE_URL to the application MySQL connection}"
      NEO4J_URI: "${NEO4J_URI:-bolt://neo4j:7687}"
      NEO4J_USER: "${NEO4J_USER:-neo4j}"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:?Set NEO4J_PASSWORD}"
      NEO4J_DATABASE: "${NEO4J_DATABASE:-neo4j}"
      MILVUS_HOST: milvus
      MILVUS_PORT: "19530"
      MILVUS_COLLECTION: "${MILVUS_COLLECTION:-gustobot_documents_v1}"
      MILVUS_INDEX_TYPE: IVF_FLAT
      MILVUS_METRIC_TYPE: IP
      LLM_API_KEY: "${LLM_API_KEY:-}"
      LLM_BASE_URL: "${LLM_BASE_URL:-https://api.openai.com/v1}"
      LLM_MODEL: "${LLM_MODEL:-gpt-4o-mini}"
      LLM_EXTRA_BODY: "${LLM_EXTRA_BODY:-null}"
      EMBEDDING_API_KEY: "${EMBEDDING_API_KEY:-}"
      EMBEDDING_BASE_URL: "${EMBEDDING_BASE_URL:-https://api.openai.com/v1}"
      EMBEDDING_MODEL: "${EMBEDDING_MODEL:-text-embedding-3-small}"
      EMBEDDING_DIMENSION: "${EMBEDDING_DIMENSION:-1536}"
      EMBEDDING_BATCH_SIZE: "${EMBEDDING_BATCH_SIZE:-64}"
      DOCUMENT_EMBEDDING_TIMEOUT: "${DOCUMENT_EMBEDDING_TIMEOUT:-60}"
      BUILD_EMBEDDING_TIMEOUT: "${BUILD_EMBEDDING_TIMEOUT:-60}"
      SEMANTIC_LINKING_MODE: "${SEMANTIC_LINKING_MODE:-off}"
      SEMANTIC_EMBEDDING_REVISION: "${SEMANTIC_EMBEDDING_REVISION:-}"
      SEMANTIC_CONCEPT_TOP_K: "${SEMANTIC_CONCEPT_TOP_K:-8}"
      SEMANTIC_ENTITY_TOP_K: "${SEMANTIC_ENTITY_TOP_K:-10}"
      SEMANTIC_FAMILY_LIMIT: "${SEMANTIC_FAMILY_LIMIT:-20}"
      SEMANTIC_EMBEDDING_TIMEOUT: "${SEMANTIC_EMBEDDING_TIMEOUT:-3}"
      SEMANTIC_ANN_TIMEOUT: "${SEMANTIC_ANN_TIMEOUT:-1}"
      SEMANTIC_BUILD_OPERATION_TIMEOUT: "${SEMANTIC_BUILD_OPERATION_TIMEOUT:-30}"
      SEMANTIC_INITIALIZATION_TIMEOUT: "${SEMANTIC_INITIALIZATION_TIMEOUT:-30}"
      SEMANTIC_RETRIEVAL_DEADLINE: "${SEMANTIC_RETRIEVAL_DEADLINE:-5}"
      SEMANTIC_INDEX_POLL_SECONDS: "${SEMANTIC_INDEX_POLL_SECONDS:-5}"
      SEMANTIC_INDEX_BATCH_SIZE: "${SEMANTIC_INDEX_BATCH_SIZE:-512}"
      SEMANTIC_INDEX_QUIET_SECONDS: "${SEMANTIC_INDEX_QUIET_SECONDS:-5}"
      RERANK_ENABLED: "${RERANK_ENABLED:-false}"
      RERANK_PROVIDER: "${RERANK_PROVIDER:-custom}"
      RERANK_API_FORMAT: "${RERANK_API_FORMAT:-dashscope}"
      RERANK_BASE_URL: "${RERANK_BASE_URL:-}"
      RERANK_ENDPOINT: "${RERANK_ENDPOINT:-}"
      RERANK_API_KEY: "${RERANK_API_KEY:-}"
      RERANK_MODEL: "${RERANK_MODEL:-}"
      RERANK_TIMEOUT: "${RERANK_TIMEOUT:-30}"
      RERANK_MAX_CANDIDATES: "${RERANK_MAX_CANDIDATES:-20}"
      RERANK_TOP_N: "${RERANK_TOP_N:-6}"
      VISION_API_KEY: "${VISION_API_KEY:-}"
      VISION_BASE_URL: "${VISION_BASE_URL:-}"
      VISION_MODEL: "${VISION_MODEL:-}"
      IMAGE_GENERATION_API_KEY: "${IMAGE_GENERATION_API_KEY:-}"
      IMAGE_GENERATION_BASE_URL: "${IMAGE_GENERATION_BASE_URL:-}"
      IMAGE_GENERATION_MODEL: "${IMAGE_GENERATION_MODEL:-}"
      IMAGE_GENERATION_SIZE: "${IMAGE_GENERATION_SIZE:-1024x1024}"
      KB_TOP_K: "${KB_TOP_K:-5}"
      KB_CHUNK_SIZE: "${KB_CHUNK_SIZE:-512}"
      KB_CHUNK_OVERLAP: "${KB_CHUNK_OVERLAP:-80}"
      FILE_UPLOAD_MAX_MB: "${FILE_UPLOAD_MAX_MB:-20}"
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:5174,http://localhost:3000}"
    volumes:
      - ./data:/app/data:ro
      - uploads_data:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      milvus:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  migrate:
    build: *backend-build
    entrypoint: []
    command: ["python", "scripts/migrate_database.py"]
    environment: *knowledge-environment
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  semantic-indexer:
    profiles: [semantic]
    build: *backend-build
    command: ["python", "-m", "scripts.build_semantic_index", "watch", "--batch-size", "${SEMANTIC_INDEX_BATCH_SIZE:-512}", "--poll-seconds", "${SEMANTIC_INDEX_POLL_SECONDS:-5}", "--quiet-seconds", "${SEMANTIC_INDEX_QUIET_SECONDS:-5}"]
    environment: *knowledge-environment
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  mysql:
    image: mysql:8.0.36
    environment:
      MYSQL_DATABASE: "${MYSQL_DATABASE:-gustobot}"
      MYSQL_USER: "${MYSQL_USER:-gustobot}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}"
    ports:
      - "${MYSQL_PORT:-13306}:3306"
    volumes:
      - application_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD}"
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - facts_neo4j_data:/data
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  milvus:
    image: milvusdb/milvus:v2.5.12
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_USE_EMBED: "true"
      ETCD_DATA_DIR: /var/lib/milvus/etcd
      ETCD_CONFIG_PATH: /milvus/configs/embedEtcd.yaml
      COMMON_STORAGETYPE: local
    ports:
      - "${MILVUS_PORT:-19530}:19530"
      - "${MILVUS_HEALTH_PORT:-9091}:9091"
    volumes:
      - documents_milvus_data:/var/lib/milvus
      - type: bind
        source: ./docker/milvus/embedEtcd.yaml
        target: /milvus/configs/embedEtcd.yaml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./docker/milvus/user.yaml
        target: /milvus/configs/user.yaml
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 90s
    restart: unless-stopped

  redis:
    profiles: [cache]
    image: redis:7.2-alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  application_mysql_data:
  facts_neo4j_data:
  documents_milvus_data:
  uploads_data:
  redis_data:
